server {
    listen 80 default_server;
    server_name _;

    root /opt/procureledger/ui/dist;
    index index.html;

    # API routes -> uvicorn. Mirrors ui/vite.config.ts's dev proxy.
    # The (/|$) boundary stops /invoicesfoo from matching /invoices.
    location ~ ^/(agent|invoices|pos|purchases|requisitions|approvals|rfqs|quotes|followup|audit|health|ready)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /agent/run can take several model round-trips.
        proxy_read_timeout 300s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
